<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="UDCSP Guardian avatar">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2136"/>
      <stop offset="1" stop-color="#0a1929"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#00b4a6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00b4a6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00b4a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00b4a6" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#00b4a6" stop-opacity="0.45"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M256 104 C300 128 350 140 388 144 L388 268 C388 340 332 392 256 416 C180 392 124 340 124 268 L124 144 C162 140 212 128 256 104 Z"/>
    </clipPath>
  </defs>

  <!-- rounded tile -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#tile)"/>
  <rect x="8.5" y="8.5" width="495" height="495" rx="103.5" fill="none" stroke="#1e3a56" stroke-width="1"/>

  <!-- soft glow behind the core -->
  <circle cx="256" cy="252" r="150" fill="url(#glow)"/>

  <!-- radar rings + proactive sweep, clipped to the shield -->
  <g clip-path="url(#shieldClip)">
    <path d="M256 252 L256 96 A156 156 0 0 1 402 200 Z" fill="url(#sweep)"/>
    <circle cx="256" cy="252" r="44" fill="none" stroke="#4aa3ff" stroke-width="3" stroke-opacity="0.55"/>
    <circle cx="256" cy="252" r="82" fill="none" stroke="#4aa3ff" stroke-width="3" stroke-opacity="0.40"/>
    <circle cx="256" cy="252" r="120" fill="none" stroke="#4aa3ff" stroke-width="3" stroke-opacity="0.28"/>
    <!-- detected life-event blips -->
    <circle cx="322" cy="180" r="9" fill="#00b4a6"/>
    <circle cx="188" cy="300" r="7" fill="#4aa3ff"/>
    <circle cx="330" cy="316" r="6" fill="#ffffff" fill-opacity="0.85"/>
  </g>

  <!-- shield outline -->
  <path d="M256 104 C300 128 350 140 388 144 L388 268 C388 340 332 392 256 416 C180 392 124 340 124 268 L124 144 C162 140 212 128 256 104 Z"
        fill="none" stroke="url(#edge)" stroke-width="11" stroke-linejoin="round"/>

  <!-- autonomous core -->
  <circle cx="256" cy="252" r="20" fill="#ffffff"/>
  <circle cx="256" cy="252" r="20" fill="none" stroke="#00b4a6" stroke-width="5"/>
  <circle cx="256" cy="252" r="7" fill="#0078d4"/>
</svg>
