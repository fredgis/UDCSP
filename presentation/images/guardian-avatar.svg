<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="UDCSP Guardian robot avatar">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2136"/>
      <stop offset="1" stop-color="#0a1929"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#00b4a6"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf2fb"/>
      <stop offset="1" stop-color="#c3d3e6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00e0cf" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00e0cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00b4a6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00b4a6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="shieldClip">
      <path d="M256 96 C300 122 352 134 392 138 L392 266 C392 342 334 396 256 420 C178 396 120 342 120 266 L120 138 C160 134 212 122 256 96 Z"/>
    </clipPath>
  </defs>

  <!-- rounded tile -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#tile)"/>
  <rect x="8.5" y="8.5" width="495" height="495" rx="103.5" fill="none" stroke="#1e3a56" stroke-width="1"/>

  <!-- soft halo -->
  <circle cx="256" cy="250" r="170" fill="url(#halo)"/>

  <!-- faint radar rings inside the shield (proactive scan) -->
  <g clip-path="url(#shieldClip)">
    <circle cx="256" cy="252" r="150" fill="none" stroke="#3b7fd0" stroke-width="2" stroke-opacity="0.20"/>
    <circle cx="256" cy="252" r="184" fill="none" stroke="#3b7fd0" stroke-width="2" stroke-opacity="0.14"/>
  </g>

  <!-- shield frame -->
  <path d="M256 96 C300 122 352 134 392 138 L392 266 C392 342 334 396 256 420 C178 396 120 342 120 266 L120 138 C160 134 212 122 256 96 Z"
        fill="none" stroke="url(#edge)" stroke-width="11" stroke-linejoin="round"/>

  <!-- antenna -->
  <line x1="256" y1="150" x2="256" y2="118" stroke="#00b4a6" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="112" r="12" fill="url(#glow)"/>
  <circle cx="256" cy="112" r="7" fill="#00e0cf"/>

  <!-- ears / bolts -->
  <rect x="150" y="226" width="20" height="46" rx="9" fill="url(#steel)" stroke="#9db4cc" stroke-width="2"/>
  <rect x="342" y="226" width="20" height="46" rx="9" fill="url(#steel)" stroke="#9db4cc" stroke-width="2"/>

  <!-- robot head -->
  <rect x="166" y="178" width="180" height="128" rx="30" fill="url(#steel)" stroke="#9db4cc" stroke-width="3"/>

  <!-- visor screen -->
  <rect x="186" y="204" width="140" height="62" rx="20" fill="#0a1f38"/>
  <rect x="186" y="204" width="140" height="62" rx="20" fill="none" stroke="#0078d4" stroke-width="2.5"/>

  <!-- eyes -->
  <circle cx="223" cy="235" r="16" fill="url(#glow)"/>
  <circle cx="289" cy="235" r="16" fill="url(#glow)"/>
  <circle cx="223" cy="235" r="11" fill="#00e0cf"/>
  <circle cx="289" cy="235" r="11" fill="#00e0cf"/>
  <circle cx="220" cy="231" r="3.5" fill="#ffffff"/>
  <circle cx="286" cy="231" r="3.5" fill="#ffffff"/>

  <!-- friendly smile -->
  <path d="M232 286 Q256 300 280 286" fill="none" stroke="#7d94ad" stroke-width="4.5" stroke-linecap="round"/>

  <!-- chest emblem: proactive AI core -->
  <circle cx="256" cy="356" r="26" fill="none" stroke="#00b4a6" stroke-width="3" stroke-opacity="0.7"/>
  <path d="M256 356 L256 335 A21 21 0 0 1 275 348 Z" fill="#00b4a6" fill-opacity="0.30"/>
  <circle cx="256" cy="356" r="9" fill="#0078d4"/>
  <circle cx="256" cy="356" r="9" fill="none" stroke="#00e0cf" stroke-width="3"/>
</svg>
